{% extends "main.html" %}

{% block title %} Register Form {% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-body p-4">
                    <h3 class="text-center mb-4">Create an Account</h3>
        
                    <!-- Show Messages -->
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-info">{{ message }}</div>
                        {% endfor %}
                    {% endif %}

                    <form method="POST" action="" enctype="multipart/form-data">
                        {% csrf_token %}
                        
                        <!-- First Name -->
                        <label for="first_name" class="form-label">First Name</label>
                        <input type="text" id="first_name" name="first_name" class="form-control" required>

                        <!-- Last Name -->
                        <label for="last_name" class="form-label mt-3">Last Name</label>
                        <input type="text" id="last_name" name="last_name" class="form-control" required>

                        <!-- Role Selection -->
                        <label for="role" class="form-label mt-3">Select Role</label>
                        <select id="role" name="role" class="form-select" required>
                            <option value="">-- Choose Role --</option>
                            <option value="Editor">Editor</option>
                            <option value="Journalist">Journalist</option>
                            <option value="User">User</option>
                        </select>

                        <!-- Email -->
                        <label for="email" class="form-label mt-3">Email</label>
                        <input type="email" id="email" name="email" class="form-control" required>

                        <!-- Password -->
                        <label for="password" class="form-label mt-3">Password</label>
                        <input type="password" id="password" name="password" class="form-control" required>

                        <!-- Confirm Password -->
                        <label for="confirm_password" class="form-label mt-3">Confirm Password</label>
                        <input type="password" id="confirm_password" name="confirm_password" class="form-control" required>

                        <br>

                        <button type="submit" class="btn btn-primary w-100">Submit</button>
                    </form>
                </div>
            </div>    
        </div>
    </div>
</div>
{% endblock %}
