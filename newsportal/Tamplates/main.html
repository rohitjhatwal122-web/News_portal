<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}News Portal{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <!-- ✅ Updated Navbar for News Portal -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="">📰 News Portal</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" 
                data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" 
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href=""> news</a></li>
                    <li class="nav-item"><a class="nav-link" href="">World news</a></li>
                    <li class="nav-item"><a class="nav-link" href="">Local news</a></li>
                    <li class="nav-item"><a class="nav-link" href="">Sports news</a></li>
                    <li class="nav-item"><a class="nav-link" href="">Upload News</a></li>
        
                </ul>
                {% if request.user.is_authenticated %}
    <a class="btn btn-danger" href="{% url 'logout' %}">Logout</a>
{% else %}
    <a class="btn btn-primary" href="{% url 'login' %}">Login</a>
{% endif %}

            </div>
        </div>
    </nav>

    {% block content %}
    {% endblock %}

    <!-- Footer -->
    <footer class="bg-dark text-light text-center py-3 mt-4">
        <p class="mb-0">© 2025 News Portal | All Rights Reserved</p>
    </footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
