{% extends 'main.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-header bg-primary text-white text-center rounded-top-4">
                    <h3>Verify OTP</h3>
                </div>
                <div class="card-body p-5">
                    {% if messages %}
                        {% for message in messages %}
                            <p style="color:red;">{{ message }}</p>
                        {% endfor %}
                    {% endif %}

                    <form method="POST" action="{% url 'verify_otp' %}">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="otp" class="form-label">Enter OTP sent to your email</label>
                            <input type="text" class="form-control form-control-lg rounded-pill" id="otp" name="otp" placeholder="OTP" required>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg rounded-pill shadow-sm">Verify OTP</button>
                        </div>
                    </form>
                </div>

                <div class="card-footer text-center text-muted">
                    Didn't receive OTP? <a href="{% url 'forgot_password' %}">Resend OTP</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
