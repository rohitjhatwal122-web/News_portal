{% extends "main.html" %}
{% block title %}{{ news.heading }}{% endblock %}

{% block content %}
<div class="container my-5">
  <div class="card shadow">
    <img src="{{ news.heading_image.url }}" class="card-img-top" alt="{{ news.heading }}">
    <div class="card-body">
      <h2 class="card-title">{{ news.heading }}</h2>
      <p class="text-muted">By {{ news.author.username }} — {{ news.published_at }}</p>
      <hr>
      <p>{{ news.description }}</p>
      <p>{{ news.description_2 }}</p>
    </div>
  </div>
</div>
{% endblock %}
